<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Control de Expresos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #161B22;
    --muted: #5B6472;
    --bg: #F1F3F6;
    --card: #FFFFFF;
    --line: #DDE1E8;
    --ida: #2B5FE0;
    --ida-soft: #E8EEFD;
    --vuelta: #1F8A5F;
    --vuelta-soft: #E4F5ED;
    --radius: 14px;
    --shadow: 0 1px 2px rgba(22,27,34,.04), 0 6px 16px rgba(22,27,34,.05);
    --font-display: 'Space Grotesk', 'Inter', -apple-system, sans-serif;
    --font-body: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: var(--font-body);
    background: var(--bg);
    color: var(--ink);
    padding: 28px 16px 56px;
    font-variant-numeric: tabular-nums;
  }
  .wrap { max-width: 620px; margin: 0 auto; }

  .hero { text-align: center; margin-bottom: 22px; }
  .route { display: flex; align-items: flex-end; justify-content: center; margin-bottom: 14px; }
  .route-point { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 1.5rem; }
  .route-point em { font-style: normal; font-size: .6rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  .route-line { flex: 0 1 110px; height: 2px; margin: 0 8px 15px; background-image: linear-gradient(90deg, var(--ida) 55%, transparent 45%); background-size: 9px 2px; background-repeat: repeat-x; position: relative; }
  .route-line::after { content: '🚗'; position: absolute; top: -9px; left: 42%; font-size: .8rem; }
  .hero h1 { font-family: var(--font-display); font-size: 1.5rem; font-weight: 700; margin: 0 0 5px; letter-spacing: -0.01em; }
  .hero .tagline { margin: 0; color: var(--muted); font-size: .83rem; padding: 0 20px; }

  .toolbar { display:flex; gap:8px; margin-bottom:8px; }
  .toolbar button {
    flex:1; background: var(--card); border: 1px solid var(--line); border-radius: 11px;
    padding: 10px 10px; font-size: .78rem; color: var(--muted); text-align: center;
    cursor: pointer; font-weight: 600;
  }
  .toolbar button:hover { border-color: var(--ida); color: var(--ida); }

  .panel {
    display: none; background: var(--card); border: 1px solid var(--line); border-radius: 11px;
    padding: 16px; margin-bottom: 10px; gap: 12px; flex-direction: column;
  }
  .panel.open { display: flex; }
  .panel h4 { margin: 0 0 2px; font-size: .78rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  .panel .row { display:flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .panel label { font-size: .8rem; display: flex; align-items: center; gap: 6px; color: var(--muted); font-weight: 600; flex:1; min-width:140px;}
  .panel input[type="number"] { width: 80px; padding: 7px 8px; border: 1px solid var(--line); border-radius: 8px; font-size: .88rem; font-family: var(--font-body); }
  .panel input[type="url"] { flex:1; min-width:180px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; font-size: .82rem; font-family: var(--font-body); }
  .panel button.action { background: var(--ink); color: #fff; border: none; border-radius: 9px; padding: 9px 16px; font-size: .8rem; font-weight: 700; cursor: pointer; }
  .panel .hint { font-size:.72rem; color: var(--muted); line-height:1.4; }
  .panel .status { font-size:.72rem; font-weight:700; }
  .panel .status.ok { color: var(--vuelta); }
  .panel .status.err { color: #A8433A; }

  .nav {
    display: flex; align-items: center; justify-content: space-between;
    background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow);
    padding: 8px 6px; margin-bottom: 16px;
  }
  .nav button { background: none; border: none; font-size: 1.3rem; color: var(--ida); cursor: pointer; width: 38px; height: 38px; border-radius: 9px; }
  .nav button:hover { background: var(--ida-soft); }
  .nav .label { font-family: var(--font-display); font-weight: 700; font-size: 1.02rem; text-transform: capitalize; }
  .nav .today-btn { font-size:.68rem; font-weight:700; color: var(--muted); border:1px solid var(--line); border-radius:8px; padding:5px 8px; width:auto; height:auto; }

  .calendar-card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px; margin-bottom: 16px; }
  table { width:100%; border-collapse: collapse; }
  th { font-size:.68rem; color: var(--muted); font-weight:700; padding:4px 2px; text-transform:uppercase; letter-spacing:.03em; }
  td { text-align:center; padding:3px; vertical-align:top; }
  .day-cell { border-radius:10px; padding:5px 2px 6px; min-height:60px; background:#FAFBFD; border:1px solid var(--line); }
  .day-cell.empty { background:transparent; border:none; }
  .day-num { font-size:.72rem; color: var(--muted); margin-bottom:4px; font-weight:600;}
  .day-num.today { color: var(--ida); font-weight:800; }
  .btn-row { display:flex; gap:3px; justify-content:center; }
  .toggle-sm {
    width:23px; height:23px; border-radius:6px; border:1.5px solid var(--line);
    background:#fff; cursor:pointer; font-size:.62rem; font-weight:800;
    display:flex; align-items:center; justify-content:center; color: var(--muted); line-height:1;
  }
  .toggle-sm.ida.active { background: var(--ida); border-color: var(--ida); color:#fff; }
  .toggle-sm.vuelta.active { background: var(--vuelta); border-color: var(--vuelta); color:#fff; }
  .legend { display:flex; gap:16px; margin-top:10px; font-size:.72rem; color: var(--muted); align-items:center; padding-left:2px;}
  .legend .dot { display:inline-block; width:11px; height:11px; border-radius:4px; margin-right:5px; vertical-align:middle; }

  .quincenas { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-bottom: 20px; }
  .q-card {
    position: relative; background: var(--card); border: 1px solid var(--line);
    border-radius: 10px; padding: 15px 15px 14px;
  }
  .q-card::before, .q-card::after {
    content: ''; position: absolute; width: 14px; height: 14px; background: var(--bg);
    border: 1px solid var(--line); border-radius: 50%; top: 50%; transform: translateY(-50%);
  }
  .q-card::before { left: -8px; }
  .q-card::after { right: -8px; }
  .q-card h3 { margin: 0; font-size: .68rem; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
  .q-card .range { display: block; font-size: .72rem; color: var(--muted); margin-top: 1px; }
  .q-card .stats { font-size: .76rem; margin: 12px 0 3px; color: var(--ink); }
  .q-card .total { font-family: var(--font-display); font-size: 1.55rem; font-weight: 700; }
  .q-card .copy-btn {
    position: absolute; top: 13px; right: 13px; background: var(--bg); border: 1px solid var(--line);
    color: var(--muted); width: 25px; height: 25px; border-radius: 7px; font-size: .72rem; cursor: pointer;
  }
  .q-card .copy-btn:hover { color: var(--ink); border-color: var(--muted); }

  .month-total {
    display: flex; justify-content: space-between; align-items: center;
    background: var(--ink); color: #fff; border-radius: var(--radius);
    padding: 18px 20px 16px; margin: 8px 0 14px; border-top: 2px dashed rgba(255,255,255,.22);
  }
  .month-total .lbl { font-size: .83rem; font-weight: 700; opacity: .8; }
  .month-total .val { font-family: var(--font-display); font-size: 1.4rem; font-weight: 700; }

  .reset { display: block; margin: 4px auto 0; background: none; border: none; color: #A8433A; font-size: .77rem; cursor: pointer; padding: 8px; opacity: .8; }
  .reset:hover { opacity: 1; }
  .loading { text-align: center; padding: 80px 10px; color: var(--muted); font-size: .9rem; }

  button:focus-visible, input:focus-visible { outline: 2px solid var(--ida); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  @media (max-width: 400px) {
    .day-cell { min-height:52px; }
    .toggle-sm { width:20px; height:20px; font-size:.58rem; }
    .q-card .total { font-size: 1.25rem; }
  }

  #splash {
    position: fixed; inset: 0; background: #000; z-index: 9999;
    display: flex; align-items: center; justify-content: center;
    transition: opacity .6s ease;
  }
  #splash img { max-width: 78%; max-height: 82vh; object-fit: contain; }
  #splash.fade-out { opacity: 0; pointer-events: none; }

  .footer-brand {
    margin-top: 24px; padding-top: 18px; border-top: 1px solid var(--line);
    text-align: center;
  }
  .footer-brand img { max-width: 150px; margin-bottom: 10px; }
  .footer-brand .caption { font-size: .72rem; color: var(--muted); margin-bottom: 12px; }
  .wa-buttons { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .wa-btn {
    display: inline-flex; align-items: center; gap: 7px; background: #25D366; color: #fff;
    text-decoration: none; padding: 10px 16px; border-radius: 10px; font-size: .8rem;
    font-weight: 700; box-shadow: var(--shadow); border: none; cursor: pointer;
  }
  .wa-btn:hover { filter: brightness(1.05); }
  .wa-btn.secondary { background: #128C7E; }

  #toast-wrap {
    position: fixed; top: 14px; left: 50%; transform: translateX(-50%);
    z-index: 10000; display: flex; flex-direction: column; gap: 8px;
    align-items: center; width: 100%; padding: 0 12px; pointer-events: none;
  }
  .toast {
    background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 10px;
    font-size: .82rem; font-weight: 600; box-shadow: var(--shadow);
    display: flex; align-items: center; gap: 8px; max-width: 420px;
    opacity: 0; transform: translateY(-10px); transition: opacity .25s ease, transform .25s ease;
  }
  .toast.show { opacity: 1; transform: translateY(0); }
  .toast.ida { background: var(--ida); }
  .toast.vuelta { background: var(--vuelta); }
  .toast.err { background: #A8433A; }
  .toast.info { background: var(--ink); }
</style>
</head>

<script>
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const DIAS_SEM = ['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];

let anio, mes;
{
  const hoy = new Date();
  anio = hoy.getFullYear();
  mes = hoy.getMonth();
}
let datosMes = {};       // { "1": {ida:true, vuelta:false}, ... }
let tarifas = { ida: 1.5, vuelta: 1.5 };
let webhookUrl = 'https://script.google.com/macros/s/AKfycbxutzQPpJlAdqLm5s6b3I1bzmT5h9JrUFOLZWDJrdKJmh7O8kCfgjdoIDEEWvpolBWf/exec';
let panelAbierto = false;
let syncStatus = '';     // '', 'ok', 'err'
let syncMsg = '';

const KEY_TARIFAS = 'tarifas';
const KEY_WEBHOOK = 'webhook_url';
function keyMes(a, m) { return `expresos-${a}-${String(m + 1).padStart(2, '0')}`; }

async function cargarTarifas() {
  try { const r = await window.storage.get(KEY_TARIFAS, false); return r ? JSON.parse(r.value) : { ida: 1.5, vuelta: 1.5 }; }
  catch (e) { return { ida: 1.5, vuelta: 1.5 }; }
}
async function guardarTarifas(t) {
  try { await window.storage.set(KEY_TARIFAS, JSON.stringify(t), false); } catch (e) {}
}
const WEBHOOK_POR_DEFECTO = 'https://script.google.com/macros/s/AKfycbxutzQPpJlAdqLm5s6b3I1bzmT5h9JrUFOLZWDJrdKJmh7O8kCfgjdoIDEEWvpolBWf/exec';
async function cargarWebhook() {
  try { const r = await window.storage.get(KEY_WEBHOOK, false); return (r && r.value) ? r.value : WEBHOOK_POR_DEFECTO; }
  catch (e) { return WEBHOOK_POR_DEFECTO; }
}
async function guardarWebhook(url) {
  try { await window.storage.set(KEY_WEBHOOK, url, false); } catch (e) {}
}
async function cargarMes(a, m) {
  try { const r = await window.storage.get(keyMes(a, m), false); return r ? JSON.parse(r.value) : {}; }
  catch (e) { return {}; }
}
async function guardarMes(a, m, data) {
  try { await window.storage.set(keyMes(a, m), JSON.stringify(data), false); } catch (e) {}
}

// --- Notificaciones (toasts) ---
function mostrarToast(mensaje, tipo = 'info', duracion = 2600) {
  const wrap = document.getElementById('toast-wrap');
  if (!wrap) return;
  const el = document.createElement('div');
  el.className = `toast ${tipo}`;
  el.textContent = mensaje;
  wrap.appendChild(el);
  requestAnimationFrame(() => el.classList.add('show'));
  setTimeout(() => {
    el.classList.remove('show');
    setTimeout(() => el.remove(), 300);
  }, duracion);
}

function ultimoDia(a, m) { return new Date(a, m + 1, 0).getDate(); }
function fmtFecha(a, m, d) { return `${a}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`; }

function calcularTotales(dias) {
  let idas = 0, vueltas = 0;
  dias.forEach(d => {
    const e = datosMes[d];
    if (e && e.ida) idas++;
    if (e && e.vuelta) vueltas++;
  });
  const total = idas * tarifas.ida + vueltas * tarifas.vuelta;
  return { idas, vueltas, total };
}
function esHoy(a, m, d) {
  const h = new Date();
  return a === h.getFullYear() && m === h.getMonth() && d === h.getDate();
}

function render() {
  const ultimo = ultimoDia(anio, mes);
  const diasQ1 = []; for (let d = 1; d <= Math.min(15, ultimo); d++) diasQ1.push(d);
  const diasQ2 = []; for (let d = 16; d <= ultimo; d++) diasQ2.push(d);
  const q1 = calcularTotales(diasQ1);
  const q2 = calcularTotales(diasQ2);
  const todos = []; for (let d = 1; d <= ultimo; d++) todos.push(d);
  const totalMes = calcularTotales(todos);

  // construir grid del calendario (lunes-domingo)
  const firstDay = new Date(anio, mes, 1);
  let startWeekday = firstDay.getDay();
  startWeekday = (startWeekday === 0) ? 6 : startWeekday - 1;
  let celdas = [];
  for (let i = 0; i < startWeekday; i++) celdas.push(null);
  for (let d = 1; d <= ultimo; d++) celdas.push(d);
  while (celdas.length % 7 !== 0) celdas.push(null);

  let html = `
    <div class="hero">
      <div class="route" aria-hidden="true">
        <span class="route-point">🏠<em>Casa</em></span>
        <span class="route-line"></span>
        <span class="route-point">🏢<em>Trabajo</em></span>
      </div>
      <h1>Control de Expresos</h1>
      <p class="tagline">Cada ida y cada vuelta, sumadas por quincena</p>
    </div>

    <div class="toolbar">
      <button id="btnTarifas">⚙️ Tarifas — Ida $${tarifas.ida.toFixed(2)} · Vuelta $${tarifas.vuelta.toFixed(2)}</button>
      <button id="btnAdmin">🛠️ Panel / Google Sheets</button>
    </div>

    <div class="panel" id="panelTarifas">
      <h4>Tarifas</h4>
      <div class="row">
        <label>Ida $ <input type="number" min="0" step="0.01" inputmode="decimal" id="inputIda" value="${tarifas.ida}"></label>
        <label>Vuelta $ <input type="number" min="0" step="0.01" inputmode="decimal" id="inputVuelta" value="${tarifas.vuelta}"></label>
        <button class="action" id="btnGuardarTarifas">Guardar</button>
      </div>
    </div>

    <div class="panel" id="panelAdmin">
      <h4>Sincronizar con Google Sheets</h4>
      <div class="row">
        <input type="url" id="inputWebhook" placeholder="https://script.google.com/macros/s/XXXX/exec" value="${webhookUrl}">
        <button class="action" id="btnGuardarWebhook">Guardar</button>
      </div>
      <div class="row">
        <button class="action" id="btnSincronizar" style="background:var(--vuelta)">🔄 Sincronizar ahora</button>
        <button class="action" id="btnExportar" style="background:var(--muted)">📋 Copiar resumen del mes</button>
      </div>
      <div class="status ${syncStatus}">${syncMsg}</div>
      <div class="hint">Pega aquí la URL de tu Google Apps Script (ver instrucciones adjuntas) para que cada marca se guarde también en tu hoja de cálculo, y tu hermana pueda verla y editarla.</div>
    </div>

    <div class="nav">
      <button id="btnPrev" aria-label="Mes anterior">‹</button>
      <span class="label">${MESES[mes]} ${anio}</span>
      <button id="btnHoy" class="today-btn">Hoy</button>
      <button id="btnNext" aria-label="Mes siguiente">›</button>
    </div>

    <div class="calendar-card">
      <table>
        <thead><tr>${DIAS_SEM.map(d=>`<th>${d}</th>`).join('')}</tr></thead>
        <tbody>
  `;

  for (let r = 0; r < celdas.length / 7; r++) {
    html += '<tr>';
    for (let c = 0; c < 7; c++) {
      const d = celdas[r*7+c];
      if (d === null) { html += '<td><div class="day-cell empty"></div></td>'; continue; }
      const e = datosMes[d] || {};
      const hoyClase = esHoy(anio, mes, d) ? 'today' : '';
      html += `
        <td>
          <div class="day-cell">
            <div class="day-num ${hoyClase}">${d}</div>
            <div class="btn-row">
              <button class="toggle-sm ida ${e.ida?'active':''}" data-day="${d}" data-tipo="ida">I</button>
              <button class="toggle-sm vuelta ${e.vuelta?'active':''}" data-day="${d}" data-tipo="vuelta">V</button>
            </div>
          </div>
        </td>`;
    }
    html += '</tr>';
  }

  html += `
        </tbody>
      </table>
      <div class="legend">
        <span><span class="dot" style="background:var(--ida)"></span>I = Ida</span>
        <span><span class="dot" style="background:var(--vuelta)"></span>V = Vuelta</span>
      </div>
    </div>

    <div class="quincenas">
      <div class="q-card">
        <button class="copy-btn" data-copy="q1" title="Copiar resumen">📋</button>
        <h3>1ra quincena</h3>
        <span class="range">Del 1 al 15</span>
        <div class="stats">${q1.idas} idas · ${q1.vueltas} vueltas</div>
        <div class="total">$${q1.total.toFixed(2)}</div>
      </div>
      <div class="q-card">
        <button class="copy-btn" data-copy="q2" title="Copiar resumen">📋</button>
        <h3>2da quincena</h3>
        <span class="range">Del 16 al ${ultimo}</span>
        <div class="stats">${q2.idas} idas · ${q2.vueltas} vueltas</div>
        <div class="total">$${q2.total.toFixed(2)}</div>
      </div>
    </div>

    <div class="month-total">
      <span class="lbl">Total del mes</span>
      <span class="val">$${totalMes.total.toFixed(2)}</span>
    </div>

function vincularEventos({ q1, q2, ultimo, totalMes }) {
  document.getElementById('btnPrev').onclick = () => cambiarMes(-1);
  document.getElementById('btnNext').onclick = () => cambiarMes(1);
  document.getElementById('btnHoy').onclick = () => irAHoy();

  document.getElementById('btnTarifas').onclick = () => {
    panelAbierto = panelAbierto === 'tarifas' ? false : 'tarifas';
    render();
  };
  document.getElementById('btnAdmin').onclick = () => {
    panelAbierto = panelAbierto === 'admin' ? false : 'admin';
    render();
  };
  if (panelAbierto === 'tarifas') document.getElementById('panelTarifas').classList.add('open');
  if (panelAbierto === 'admin') document.getElementById('panelAdmin').classList.add('open');

  document.getElementById('btnGuardarTarifas').onclick = async () => {
    const ida = parseFloat(document.getElementById('inputIda').value) || 0;
    const vuelta = parseFloat(document.getElementById('inputVuelta').value) || 0;
    tarifas = { ida, vuelta };
    await guardarTarifas(tarifas);
    enviarWebhook({ accion: 'tarifas', ida, vuelta });
    render();
  };

  document.getElementById('btnGuardarWebhook').onclick = async () => {
    webhookUrl = document.getElementById('inputWebhook').value.trim();
    await guardarWebhook(webhookUrl);
    syncStatus = 'ok'; syncMsg = 'URL guardada.';
    render();
  };

  document.getElementById('btnSincronizar').onclick = async () => { await sincronizar(); };

  document.getElementById('btnExportar').onclick = async () => {
    const texto = `Control de Expresos - ${MESES[mes]} ${anio}\nQuincena 1 (1-15): ${q1.idas} idas, ${q1.vueltas} vueltas = $${q1.total.toFixed(2)}\nQuincena 2 (16-${ultimo}): ${q2.idas} idas, ${q2.vueltas} vueltas = $${q2.total.toFixed(2)}\nTotal del mes: $${totalMes.total.toFixed(2)}`;
    try { await navigator.clipboard.writeText(texto); alert('Resumen copiado ✅'); } catch(e){ alert(texto); }
  };

  document.querySelectorAll('.toggle-sm').forEach(btn => {
    btn.onclick = async () => {
      const dia = btn.dataset.day;
      const tipo = btn.dataset.tipo;
      if (!datosMes[dia]) datosMes[dia] = {};
      datosMes[dia][tipo] = !datosMes[dia][tipo];
      const nuevoValor = datosMes[dia][tipo];
      await guardarMes(anio, mes, datosMes);
      enviarWebhook({ accion: 'marca', fecha: fmtFecha(anio, mes, parseInt(dia)), tipo, valor: nuevoValor });
      const etiquetaTipo = tipo === 'ida' ? 'Ida' : 'Vuelta';
      const fechaTexto = `${dia} de ${MESES[mes]}`;
      mostrarToast(
        nuevoValor
          ? `✔️ ${etiquetaTipo} marcada — ${fechaTexto}`
          : `↩️ ${etiquetaTipo} desmarcada — ${fechaTexto}`,
        tipo
      );
      render();
    };
  });

  document.getElementById('btnReset').onclick = async () => {
    const ok = confirm(`¿Borrar todos los registros de ${MESES[mes]} ${anio}? Esta acción no se puede deshacer.`);
    if (!ok) return;
    datosMes = {};
    await guardarMes(anio, mes, datosMes);
    render();
  };

  const textoResumen = `🚐 *Control de Expresos* - ${MESES[mes]} ${anio}%0A`
    + `1ra quincena (1-15): ${q1.idas} idas, ${q1.vueltas} vueltas = $${q1.total.toFixed(2)}%0A`
    + `2da quincena (16-${ultimo}): ${q2.idas} idas, ${q2.vueltas} vueltas = $${q2.total.toFixed(2)}%0A`
    + `*Total del mes: $${totalMes.total.toFixed(2)}*`;

  const waHermana = document.getElementById('waHermana');
  if (waHermana) waHermana.href = `https://api.whatsapp.com/send/?phone=593989798126&text=${textoResumen}`;
  const waDevstar = document.getElementById('waDevstar');
  if (waDevstar) waDevstar.href = `http://api.whatsapp.com/send/?phone=593998557281&text=${textoResumen}`;

  document.querySelectorAll('.copy-btn').forEach(btn => {
    btn.onclick = async () => {
      const cual = btn.dataset.copy;
      const t = cual === 'q1' ? q1 : q2;
      const rango = cual === 'q1' ? `1 al 15 de ${MESES[mes]}` : `16 al ${ultimo} de ${MESES[mes]}`;
      const subIda = (t.idas * tarifas.ida).toFixed(2);
      const subVuelta = (t.vueltas * tarifas.vuelta).toFixed(2);
      const texto = `🚗 Quincena del ${rango}: ${t.idas} idas ($${subIda}) + ${t.vueltas} vueltas ($${subVuelta}) = $${t.total.toFixed(2)}`;
      try {
        await navigator.clipboard.writeText(texto);
        const original = btn.textContent;
        btn.textContent = '✓';
        setTimeout(() => { btn.textContent = original; }, 1200);
      } catch (e) {}
    };
  });
}

// --- Webhook / Google Sheets ---
async function enviarWebhook(payload) {
  if (!webhookUrl) return;
  try {
    await fetch(webhookUrl, {
      method: 'POST',
      mode: 'no-cors', // Apps Script no siempre responde con CORS; disparamos sin leer respuesta
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify(payload)
    });
  } catch (e) {
    console.error('No se pudo enviar al webhook', e);
  }
}

async function traerDelServidor(a, m) {
  if (!webhookUrl) return null;
  try {
    const resp = await fetch(webhookUrl + '?accion=exportar_mes&anio=' + a + '&mes=' + (m + 1));
    if (!resp.ok) return null;
    const data = await resp.json();
    return data;
  } catch (e) {
    console.error('No se pudo traer datos del servidor', e);
    return null;
  }
}

function contarMarcas(dias) {
  let idas = 0, vueltas = 0;
  Object.values(dias || {}).forEach(e => {
    if (e && e.ida) idas++;
    if (e && e.vuelta) vueltas++;
  });
  return { idas, vueltas };
}

async function cargarMesConSync(a, m, notificarCargaLocal = true) {
  // 1) mostramos de una vez lo que haya en local para que no se vea vacío
  datosMes = await cargarMes(a, m);
  render();
  if (notificarCargaLocal) {
    const { idas, vueltas } = contarMarcas(datosMes);
    mostrarToast(`📅 Datos cargados: ${idas} idas · ${vueltas} vueltas en ${MESES[m]}`, 'info');
  }
  // 2) en segundo plano, traemos lo último de Google Sheets y actualizamos
  const data = await traerDelServidor(a, m);
  if (data) {
    if (data.dias) {
      datosMes = data.dias;
      await guardarMes(a, m, datosMes);
    }
    if (data.tarifas) {
      tarifas = data.tarifas;
      await guardarTarifas(tarifas);
    }
    render();
    const { idas, vueltas } = contarMarcas(datosMes);
    mostrarToast(`🔄 Sincronizado con Google Sheets: ${idas} idas · ${vueltas} vueltas`, 'info');
  }
}

async function sincronizar() {
  if (!webhookUrl) {
    syncStatus = 'err'; syncMsg = 'Primero guarda la URL del webhook.'; render(); return;
  }
  syncStatus = ''; syncMsg = 'Sincronizando…'; render();
  try {
    const resp = await fetch(webhookUrl + '?accion=exportar_mes&anio=' + anio + '&mes=' + (mes+1));
    const data = await resp.json();
    if (data && data.dias) {
      datosMes = data.dias;
      await guardarMes(anio, mes, datosMes);
    }
    if (data && data.tarifas) {
      tarifas = data.tarifas;
      await guardarTarifas(tarifas);
    }
    syncStatus = 'ok'; syncMsg = 'Sincronizado ✅';
  } catch (e) {
    syncStatus = 'err'; syncMsg = 'No se pudo sincronizar (revisa la URL o el despliegue del script).';
  }
  render();
}

async function cambiarMes(delta) {
  mes += delta;
  if (mes < 0) { mes = 11; anio--; }
  if (mes > 11) { mes = 0; anio++; }
  await cargarMesConSync(anio, mes);
}

async function irAHoy() {
  const hoy = new Date();
  anio = hoy.getFullYear();
  mes = hoy.getMonth();
  await cargarMesConSync(anio, mes);
}

async function iniciar() {
  tarifas = await cargarTarifas();
  webhookUrl = await cargarWebhook();
  await cargarMesConSync(anio, mes);
}
iniciar();

setTimeout(() => {
  const splash = document.getElementById('splash');
  if (!splash) return;
  splash.classList.add('fade-out');
  setTimeout(() => splash.remove(), 650);
}, 3000);
</script>
